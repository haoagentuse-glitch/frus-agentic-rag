[project]
name = "frus-agentic-rag"
version = "0.1.0"
description = "Bounded agentic RAG over the full published FRUS corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "ollama>=0.4",
    "lxml>=5.3",
    "pyarrow>=18",
    "lancedb>=0.17",
    "tantivy>=0.22",
    "sentence-transformers>=3.4,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "pydantic-settings>=2.6",
    "pydantic>=2.9",
    "orjson>=3.10",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "arize-phoenix-otel>=0.16.1",
    "openinference-semantic-conventions>=0.1.31",
    "openinference-instrumentation>=0.1.56",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[project.scripts]
frus = "frus_agentic_rag.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frus_agentic_rag"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",
    # This project answers in Traditional Chinese. Full-width punctuation in
    # prompts and user-facing strings is correct, not an ambiguous-character bug.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018", "E501"]  # XML fixtures keep their original line breaks

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requires real index / ollama",
    "gpu: requires CUDA",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/frus_agentic_rag"]
